openapi: 3.1.0
info:
  title: DataSetCleaner Local Agent API
  version: 1.0.0
  description: Loopback-only API for local dataset review, agent-assisted curation, and explicitly approved exports.
servers:
  - url: http://127.0.0.1:8765
paths:
  /api/health:
    get:
      operationId: getHealth
      responses:
        '200': { description: Local service status }
  /api/runs:
    get:
      operationId: listRuns
      responses:
        '200': { description: Recent analysis runs }
    post:
      operationId: analyzeDataset
      description: Starts a local analysis; sources must be local paths readable by this machine.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sources]
              properties:
                sources:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [path]
                    properties:
                      path: { type: string }
                      license_id: { type: string }
                      description: { type: string }
                field_map: { type: object, additionalProperties: { type: string } }
                preferred_fields: { type: array, items: { type: string } }
                threshold: { type: number, minimum: 0.5, maximum: 1.0, default: 0.9 }
                detect_near: { type: boolean, default: false }
                check_syntax: { type: boolean, default: true, description: "Run local code parsers; disable for a faster structural/deduplication pass." }
      responses:
        '202': { description: Analysis accepted; poll the returned run_id }
  /api/runs/{run_id}:
    get:
      operationId: getRunStatus
      parameters:
        - { name: run_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Status and analysis summary }
  /api/runs/{run_id}/findings:
    get:
      operationId: listFindings
      parameters:
        - { name: run_id, in: path, required: true, schema: { type: string } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: code, in: query, schema: { type: string } }
      responses:
        '200': { description: Paged quality findings }
  /api/runs/{run_id}/records:
    get:
      operationId: getRecords
      parameters:
        - { name: run_id, in: path, required: true, schema: { type: string } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200': { description: Paged records; content is disclosed to the calling agent }
  /api/runs/{run_id}/records/{record_id}/include:
    post:
      operationId: setRecordIncluded
      description: Reversible review decision; source files remain unchanged.
      parameters:
        - { name: run_id, in: path, required: true, schema: { type: string } }
        - { name: record_id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [include], properties: { include: { type: boolean } } }
      responses:
        '200': { description: Inclusion state updated in the local review index }
  /api/runs/{run_id}/candidates:
    get:
      operationId: listGeneratedCandidates
      parameters:
        - { name: run_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Separately staged, unapproved generated examples }
    post:
      operationId: stageGeneratedCandidates
      description: Saves proposed examples separately; they are not merged into the export automatically.
      parameters:
        - { name: run_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [examples, provider, model]
              properties:
                examples: { type: array, minItems: 1, maxItems: 100, items: { type: object } }
                provider: { type: string }
                model: { type: string }
      responses:
        '201': { description: Candidate file and provenance manifest created }
  /api/runs/{run_id}/preview-export:
    post:
      operationId: previewExport
      parameters:
        - { name: run_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                exclude_near: { type: boolean, default: false }
                exclude_incomplete: { type: boolean, default: false }
                exclude_malformed: { type: boolean, default: true }
      responses:
        '200': { description: Export count and unresolved rights warnings }
  /api/runs/{run_id}/export:
    post:
      operationId: exportReviewedDataset
      description: Writes a new package only after explicit user approval; approval does not establish redistribution rights.
      parameters:
        - { name: run_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [output_dir, dataset_name, user_approved]
              properties:
                output_dir: { type: string }
                dataset_name: { type: string }
                description: { type: string }
                output_format: { type: string, enum: [jsonl, csv, parquet], default: jsonl }
                exclude_near: { type: boolean, default: false }
                exclude_incomplete: { type: boolean, default: false }
                exclude_malformed: { type: boolean, default: true }
                user_approved: { type: boolean, const: true }
      responses:
        '201': { description: Approved dataset package exported }
